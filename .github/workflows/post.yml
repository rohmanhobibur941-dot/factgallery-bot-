name: FactGallery auto post

on:
  schedule:
    - cron: "0 4 * * *"    # 9:30 AM IST
    - cron: "0 9 * * *"    # 2:30 PM IST
    - cron: "0 14 * * *"   # 7:30 PM IST
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Sirf test: publish mat karo"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install requests pillow google-api-python-client google-auth

      - name: Generate post and image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python blog_main.py generate

      - name: Save image to repo (public CDN link ke liye)
        if: ${{ github.event.inputs.skip_publish != 'true' }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add images
          git commit -m "new image" || echo "nothing to commit"
          git pull --rebase || true
          git push

      - name: Publish to Blogger
        if: ${{ github.event.inputs.skip_publish != 'true' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BLOG_REFRESH_TOKEN: ${{ secrets.BLOG_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: python blog_main.py publish

      - name: Save used topics
        if: ${{ github.event.inputs.skip_publish != 'true' }}
        run: |
          git add used.txt || true
          git commit -m "update used topics" || echo "nothing to commit"
          git pull --rebase || true
          git push || true

      - name: Save preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            work/preview.jpg
            work/post.json
          retention-days: 3
          if-no-files-found: ignore
